<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checko PHP API — Клиент</title>
    <style>
        :root { --accent: #2563eb; --error: #dc2626; --ok: #16a34a; }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1f2937;
        }
        h1 { font-size: 1.4rem; }
        .field { margin-bottom: 1rem; display: flex; flex-direction: column; gap: .35rem; }
        label { font-weight: 600; font-size: .9rem; }
        input {
            padding: .55rem .7rem; border: 1px solid #d1d5db; border-radius: 6px;
            font-size: 1rem; width: 100%;
        }
        input:focus { outline: 2px solid var(--accent); border-color: transparent; }
        button {
            background: var(--accent); color: #fff; border: 0; border-radius: 6px;
            padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer;
        }
        button:hover:not(:disabled) { filter: brightness(1.1); }
        button:disabled { opacity: .6; cursor: wait; }
        .hint { font-size: .8rem; color: #6b7280; }
        pre {
            background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 8px;
            overflow-x: auto; min-height: 6rem; white-space: pre-wrap; word-break: break-word;
        }
        pre.error { border-left: 4px solid var(--error); }
        pre.ok    { border-left: 4px solid var(--ok); }
        .status { font-size: .85rem; margin-top: .5rem; }
        .status.error { color: var(--error); }
        .status.ok    { color: var(--ok); }
    </style>
</head>
<body>
    <h1>Поиск компании по ИНН</h1>

    <div class="field">
        <label for="inn">ИНН (10 или 12 цифр)</label>
        <input id="inn" inputmode="numeric" maxlength="12" placeholder="7707083893" autocomplete="off">
        <span class="hint">Например: 7707083893 (юрлицо) или 502711738400 (ИП)</span>
    </div>

    <div class="field">
        <label for="apiKey">API-ключ (заголовок X-API-KEY)</label>
        <input id="apiKey" type="password" placeholder="оставьте пустым, если auth выключен" autocomplete="off">
    </div>

    <button id="fetchBtn">Получить данные</button>

    <p class="status" id="status"></p>
    <pre id="result">// Результат появится здесь</pre>

    <script>
        'use strict';

        const innInput   = document.getElementById('inn');
        const keyInput   = document.getElementById('apiKey');
        const fetchBtn   = document.getElementById('fetchBtn');
        const resultPre  = document.getElementById('result');
        const statusEl   = document.getElementById('status');

        // Сохраняем/восстанавливаем API-ключ между сессиями (localStorage).
        keyInput.value = localStorage.getItem('apiKey') || '';
        keyInput.addEventListener('change', () => localStorage.setItem('apiKey', keyInput.value.trim()));

        // Человекочитаемые сообщения для известных статусов ошибок.
        const STATUS_MESSAGES = {
            400: 'Некорректный запрос (проверьте формат ИНН)',
            401: 'Неавторизован: неверный или отсутствующий X-API-KEY',
            404: 'Компания не найдена',
            422: 'Данные не могут быть обработаны',
            500: 'Внутренняя ошибка сервера',
            502: 'Внешний API недоступен (Bad Gateway)',
        };

        async function fetchCompany() {
            const inn = innInput.value.trim();
            const key = keyInput.value.trim();

            if (!/^\d{10}(\d{2})?$/.test(inn)) {
                showResult({ error: 'Введите корректный ИНН: ровно 10 или 12 цифр' }, false, 'Проверьте ввод');
                return;
            }

            fetchBtn.disabled = true;
            statusEl.textContent = 'Запрос…';
            statusEl.className = 'status';

            try {
                const headers = { Accept: 'application/json' };
                if (key) {
                    headers['X-API-KEY'] = key;
                }

                const response = await fetch(`/api/company/${encodeURIComponent(inn)}`, { headers });

                let body;
                const text = await response.text();
                try {
                    body = JSON.parse(text);
                } catch {
                    body = { raw: text };
                }

                if (response.ok) {
                    showResult(body, true, `HTTP ${response.status} OK` + (body.cached ? ' · из кэша БД' : ' · из Checko'));
                } else {
                    const msg = STATUS_MESSAGES[response.status] || `Ошибка HTTP ${response.status}`;
                    showResult(body, false, msg);
                }
            } catch (err) {
                // Сетевая ошибка / сервер не отвечает
                showResult({ error: String(err.message || err) }, false, 'Сеть недоступна');
            } finally {
                fetchBtn.disabled = false;
            }
        }

        function showResult(data, ok, statusText) {
            resultPre.textContent = JSON.stringify(data, null, 2);
            resultPre.className = ok ? 'ok' : 'error';
            statusEl.textContent = statusText;
            statusEl.className = 'status ' + (ok ? 'ok' : 'error');
        }

        fetchBtn.addEventListener('click', fetchCompany);
        innInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') fetchCompany(); });
    </script>
</body>
</html>
