services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanilla_php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      CHECKO_API_KEY: ${CHECKO_API_KEY:-}
      CHECKO_BASE_URL: ${CHECKO_BASE_URL:-https://checko.ru/api/company}
      CHECKO_USE_MOCK: ${CHECKO_USE_MOCK:-true}
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: "5432"
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    depends_on:
      postgresql:
        condition: service_healthy

  postgresql:
    image: postgres:16-alpine
    container_name: vanilla_postgres
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
